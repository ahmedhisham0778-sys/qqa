<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الوكيل الصوتي العربي — v3 بالصوت</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI",Tahoma,sans-serif;background:#0f1720;color:#e8eef5;min-height:100vh;padding:16px;display:flex;justify-content:center}
  .wrap{width:100%;max-width:1000px;display:grid;grid-template-columns:1fr 330px;gap:16px;align-content:start}
  @media(max-width:840px){.wrap{grid-template-columns:1fr}}
  .card{background:#16202b;border:1px solid #24313f;border-radius:14px;overflow:hidden}
  .head{padding:14px 18px;background:#1b2836;border-bottom:1px solid #24313f;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .head h1{font-size:16px;font-weight:600}
  .head p{font-size:12px;color:#8fa3b8;margin-top:3px}
  .badge{font-size:11px;padding:4px 10px;border-radius:20px;white-space:nowrap}
  .badge.ai{background:#12432a;color:#5ee68f;border:1px solid #1d6b42}
  .badge.basic{background:#3d3216;color:#e6c35e;border:1px solid #6b5a1d}

  #chat{height:400px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .msg{max-width:80%;padding:10px 14px;border-radius:14px;font-size:14.5px;line-height:1.6;white-space:pre-wrap}
  .bot{background:#223243;align-self:flex-start;border-bottom-right-radius:4px}
  .user{background:#2d6cdf;align-self:flex-end;border-bottom-left-radius:4px}
  .sys{align-self:center;font-size:12px;color:#7d8fa3;background:none}
  .typing{color:#7d8fa3;font-style:italic}

  /* شريط الصوت */
  .voice{padding:16px;border-top:1px solid #24313f;background:#131d27;display:flex;flex-direction:column;align-items:center;gap:10px}
  .mic{width:74px;height:74px;border-radius:50%;border:0;background:#2d6cdf;color:#fff;font-size:30px;cursor:pointer;
       display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0}
  .mic:hover{background:#2559bd}
  .mic.rec{background:#d93838;animation:pulse 1.3s infinite}
  .mic.speak{background:#1d8a4e}
  .mic:disabled{background:#2c3b4c;cursor:not-allowed}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,56,56,.6)}70%{box-shadow:0 0 0 20px rgba(217,56,56,0)}100%{box-shadow:0 0 0 0 rgba(217,56,56,0)}}
  .vstat{font-size:13px;color:#8fa3b8;min-height:20px;text-align:center}

  .bar{display:flex;gap:8px;padding:12px;border-top:1px solid #24313f;background:#0f1720}
  input,select{padding:11px 13px;border-radius:10px;border:1px solid #2c3b4c;background:#0f1720;color:#e8eef5;font-size:14px;font-family:inherit;width:100%}
  input:focus{outline:none;border-color:#2d6cdf}
  .bar input{flex:1}
  button{padding:11px 18px;border:0;border-radius:10px;background:#2d6cdf;color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
  button:hover{background:#2559bd}
  button:disabled{background:#2c3b4c;cursor:not-allowed}
  button.ghost{background:#24313f}

  .side{padding:16px}
  .side h2{font-size:13px;color:#8fa3b8;margin-bottom:9px;font-weight:600}
  .side h2:not(:first-child){margin-top:18px}
  .wa{background:#0b141a;border:1px solid #1f2c38;border-radius:10px;padding:14px;font-size:13px;line-height:1.85;white-space:pre-wrap;color:#d6e2ee;min-height:110px}
  .wa .empty{color:#5d6f82;font-style:italic}
  .note{font-size:11.5px;color:#6d8098;line-height:1.7;margin-top:8px}
  .err{color:#ff8b8b;font-size:12px;margin-top:8px;line-height:1.6}
  .ok{color:#5ee68f}
  label.row{display:flex;align-items:center;gap:8px;font-size:13px;color:#a8bccf;margin-top:10px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <div class="head">
      <div>
        <h1 id="clinicTitle">📞 عيادة الابتسامة</h1>
        <p>دوس الميكروفون واتكلم — زي مكالمة حقيقية</p>
      </div>
      <span class="badge basic" id="mode">وضع بسيط</span>
    </div>

    <div id="chat"></div>

    <div class="voice">
      <button class="mic" id="mic" onclick="toggleMic()">🎤</button>
      <div class="vstat" id="vstat">دوس الميكروفون وابدأ اتكلم</div>
      <label class="row"><input type="checkbox" id="auto" style="width:auto" checked> وضع المكالمة (يسمع تلقائي بعد ما يرد)</label>
    </div>

    <div class="bar">
      <input id="inp" placeholder="أو اكتب هنا…" autocomplete="off">
      <button id="sendBtn" onclick="send()">إرسال</button>
      <button class="ghost" onclick="reset()">↺</button>
    </div>
  </div>

  <div class="card side">
    <h2>🔑 مفتاح الـ AI</h2>
    <input id="key" type="password" placeholder="الصق المفتاح هنا…" oninput="setMode()">
    <div class="note">
      <b class="ok">مجاناً بدون بطاقة:</b> افتح <b>aistudio.google.com/apikey</b> ← Create API key ← الصق هنا.
    </div>
    <div class="err" id="err"></div>

    <h2>🔊 الصوت</h2>
    <select id="voiceSel"></select>
    <div class="note" id="voiceNote">…بيدوّر على الأصوات</div>

    <h2>📱 اللي بيوصل واتساب العيادة</h2>
    <div class="wa" id="wa"><span class="empty">هيظهر بعد ما المكالمة تخلص…</span></div>
  </div>

</div>

<script>
/* ══════════════ ١) إعدادات العيادة ══════════════ */
const CLINIC = {
  name: "عيادة الابتسامة",
  address: "طريق الملك فهد، حي العليا، الرياض",
  hours: "من ٩ صباحاً إلى ٩ مساءً، عدا يوم الجمعة",
  workingDays: [0,1,2,3,4],
  openHour: 9, closeHour: 21, slotMinutes: 30,
  services: {
    "تنظيف الأسنان":"٣٠٠ ريال", "حشو":"٤٠٠ ريال", "تبييض":"١٥٠٠ ريال",
    "زراعة أسنان":null, "تقويم":null
  }
};
const GREETING=`أهلاً وسهلاً، ${CLINIC.name}. كيف أقدر أساعدك؟`;
const GOODBYE ="شكراً لتواصلك معنا، وبانتظارك. في أمان الله.";
const ESCALATE="هذا يحتاج أحد من الفريق يرد عليك. سجّلت طلبك وبيتواصلون معك قريب.";

/* ══════════════ ٢) أدوات النص ══════════════ */
function norm(t){ return !t?"":t.trim().replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه")
  .replace(/[ً-ْـ]/g,"").replace(/[^\w\s؀-ۿ]/g," ").replace(/\s+/g," ").trim(); }
function toEn(s){ return s.replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)); }
function extractPhone(text){
  const m=toEn(String(text)).replace(/[\s\-()]/g,"").match(/(?:\+?966|0)?5\d{8}/);
  if(!m) return null; let n=m[0];
  if(n.startsWith("+966"))return n; if(n.startsWith("966"))return "+"+n;
  if(n.startsWith("05"))return "+966"+n.slice(1); if(n.startsWith("5"))return "+966"+n;
  return null;
}

/* ══════════════ ٣) المواعيد ══════════════ */
const AR_DAYS=["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
let booked=new Set();
function nextSlots(count,dayHint=null,hourHint=null){
  const now=new Date(), earliest=new Date(now.getTime()+2*3600*1000);
  let cur=new Date(earliest);
  if(dayHint!==null){ cur=new Date(now); cur.setDate(cur.getDate()+dayHint); cur.setHours(CLINIC.openHour,0,0,0); }
  if(hourHint!==null&&hourHint>=CLINIC.openHour&&hourHint<CLINIC.closeHour&&cur.getHours()<hourHint) cur.setHours(hourHint,0,0,0);
  if(cur<earliest) cur=new Date(earliest);
  cur.setMinutes(cur.getMinutes()<30?0:30,0,0);
  const out=[]; let g=0;
  while(out.length<count&&g++<600){
    if(!CLINIC.workingDays.includes(cur.getDay())){cur.setDate(cur.getDate()+1);cur.setHours(CLINIC.openHour,0,0,0);continue;}
    if(cur.getHours()<CLINIC.openHour){cur.setHours(CLINIC.openHour,0,0,0);continue;}
    if(cur.getHours()>=CLINIC.closeHour){cur.setDate(cur.getDate()+1);cur.setHours(CLINIC.openHour,0,0,0);continue;}
    const k=cur.toISOString().slice(0,16);
    if(!booked.has(k)&&(hourHint===null||Math.abs(cur.getHours()-hourHint)<=2)) out.push(new Date(cur));
    cur.setMinutes(cur.getMinutes()+CLINIC.slotMinutes);
  }
  return out;
}
function fmtSlot(d){
  const today=new Date(); let day=AR_DAYS[d.getDay()];
  if(d.toDateString()===today.toDateString()) day="اليوم";
  else{const t=new Date(today);t.setDate(t.getDate()+1); if(d.toDateString()===t.toDateString()) day="بكرة";}
  const h=d.getHours(), h12=h%12||12;
  return `${day} الساعة ${h12}${d.getMinutes()===30?" والنص":""} ${h<12?"الصباح":(h<18?"العصر":"المساء")}`;
}

/* ══════════════ ٤) الحالة ══════════════ */
let S={};
function reset(){
  stopAll();
  S={name:null,phone:null,service:null,slot:null,offered:[],done:false,outcome:null,log:[],history:[],miss:0,state:"listening"};
  document.getElementById("chat").innerHTML="";
  document.getElementById("wa").innerHTML='<span class="empty">هيظهر بعد ما المكالمة تخلص…</span>';
  document.getElementById("err").textContent="";
  bot(GREETING);
}

/* ══════════════ ٥) العقل الذكي ══════════════ */
function buildSystemPrompt(){
  S.offered=nextSlots(3);
  const svc=Object.entries(CLINIC.services).map(([n,p])=>`- ${n}: ${p||"يحتاج كشف أولاً (الكشف مجاني)"}`).join("\n");
  const sl=S.offered.map((s,i)=>`${i}: ${fmtSlot(s)}`).join("\n");
  return `أنت موظف استقبال في ${CLINIC.name}. ترد على مكالمات هاتفية.

معلومات العيادة:
- العنوان: ${CLINIC.address}
- الدوام: ${CLINIC.hours}
- الخدمات:
${svc}

المواعيد المتاحة (استخدم الرقم عند الحجز):
${sl}

قواعد مهمة:
1. لهجة سعودية طبيعية ومختصرة. جملة أو جملتين بحد أقصى — هذي مكالمة هاتف مو شات.
2. لا تخترع أسعار أو خدمات أو مواعيد.
3. أي سؤال طبي: الدكتور يحدد بعد الكشف. لا تعطِ نصيحة طبية.
4. للحجز تحتاج: الموعد + الاسم + الجوال. اطلبها واحدة واحدة.
5. إلغاء/تعديل موعد قائم، أو طلب موظف بشري، أو موضوع معقد → action "escalate".
6. لا تؤكد الحجز إلا بعد ما تجمع الثلاثة.
7. اكتب الأرقام بالحروف العربية (مثال: "الساعة ستة والنص") لأن ردك بينطق بصوت.

رد بـ JSON فقط:
{"reply":"ردك","action":"none|book|escalate|end","slot_index":رقم أو null,"name":أو null,"phone":أو null,"service":أو null}`;
}
function keyProvider(k){ return k.startsWith("sk-") ? "openai" : "gemini"; }

async function aiReply(text){
  const key=document.getElementById("key").value.trim();
  S.history.push({role:"user",content:text});
  const raw = keyProvider(key)==="openai" ? await callOpenAI(key) : await callGemini(key);
  S.history.push({role:"assistant",content:raw});
  try{ return JSON.parse(raw); }
  catch{
    const m=raw.match(/\{[\s\S]*\}/);
    if(m){ try{ return JSON.parse(m[0]); }catch{} }
    return {reply:"عذراً، ممكن تعيد؟",action:"none"};
  }
}
async function callGemini(key){
  const contents=S.history.slice(-10).map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]}));
  const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key="+encodeURIComponent(key),
    {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
      system_instruction:{parts:[{text:buildSystemPrompt()}]},contents,
      generationConfig:{responseMimeType:"application/json",temperature:0.4,maxOutputTokens:400}})});
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error?.message||("خطأ "+r.status));}
  const j=await r.json(); const t=j.candidates?.[0]?.content?.parts?.[0]?.text;
  if(!t) throw new Error("مفيش رد من الموديل"); return t;
}
async function callOpenAI(key){
  const r=await fetch("https://api.openai.com/v1/chat/completions",{method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
    body:JSON.stringify({model:"gpt-4o-mini",response_format:{type:"json_object"},temperature:0.4,max_tokens:400,
      messages:[{role:"system",content:buildSystemPrompt()},...S.history.slice(-10)]})});
  if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.error?.message||("خطأ "+r.status));}
  return (await r.json()).choices[0].message.content;
}
function applyAction(d){
  if(d.name) S.name=d.name;
  if(d.phone) S.phone=extractPhone(d.phone)||d.phone;
  if(d.service) S.service=d.service;
  if(d.action==="book"){
    const i=Number(d.slot_index);
    if(S.offered[i]){ S.slot=S.offered[i]; booked.add(S.slot.toISOString().slice(0,16)); S.outcome="confirmed"; S.done=true; }
  } else if(d.action==="escalate"){ S.outcome="escalate"; S.done=true; }
  else if(d.action==="end"){ S.outcome="no_booking"; S.done=true; }
}

/* ══════════════ ٦) العقل البسيط (احتياطي) ══════════════ */
const KW={booking:["ابغي موعد","ابي موعد","ابغى","ودي احجز","احجز","حجز","موعد","متاح","فاضي"],
 price:["كم","بكم","وش السعر","السعر","الاسعار","سعر","تكلفه","يكلف","كام","بكام"],
 hours:["متي تفتحون","الدوام","وش دوامكم","ساعات العمل","تفتحون","مفتوح","شغالين"],
 location:["وين","فين","العنوان","الموقع","مكانكم","كيف اوصل","موقعكم","اين"],
 cancel:["الغاء","الغي","اجل","تاجيل","اؤجل","ابي اغير"],
 human:["ابي اكلم","وحده","شخص","موظف","الدكتور","بشر","حولني"],
 bye:["شكرا","مشكور","يعطيك العافيه","خلاص","سلام"]};
const PRIORITY=["human","cancel","bye","booking","price","hours","location"];
function detectIntent(text){
  const t=norm(text); if(!t) return "unknown"; const sc={};
  for(const [i,ws] of Object.entries(KW)){ let s=0;
    for(const w of ws){const k=norm(w); if(k&&t.includes(k)) s+=k.split(" ").length;} if(s) sc[i]=s; }
  const ks=Object.keys(sc); if(!ks.length) return "unknown";
  const top=Math.max(...Object.values(sc)); const tied=ks.filter(k=>sc[k]===top);
  return tied.length===1?tied[0]:(PRIORITY.find(p=>tied.includes(p))||tied[0]);
}
function findService(text){
  const t=norm(text);
  for(const [n,p] of Object.entries(CLINIC.services)){
    if(t.includes(norm(n))) return [n,p];
    const f=norm(n).split(" ")[0]; if(f.length>3&&t.includes(f)) return [n,p];
  } return [null,null];
}
function basicReply(text){
  const has=(...w)=>{const t=norm(text);return w.some(x=>t.includes(x));};
  const intent=detectIntent(text);
  if(intent==="human"){S.outcome="escalate";S.done=true;return ESCALATE;}
  if(intent==="bye"&&S.state!=="name"&&S.state!=="phone"){S.outcome="no_booking";S.done=true;return GOODBYE;}
  if(S.state==="listening"){
    if(intent==="booking"){const [sv]=findService(text); if(sv)S.service=sv;
      S.offered=nextSlots(2); S.state="slot";
      return `متوفر عندنا ${S.offered.map(fmtSlot).join(" أو ")}. أيهم يناسبك؟`;}
    if(intent==="price"){const [sv,pr]=findService(text); if(sv)S.service=sv;
      if(sv&&pr) return `${sv} عندنا بـ ${pr}. تحب أحجز لك موعد؟`;
      if(sv) return `${sv} السعر يعتمد على الحالة ويحتاج كشف أول. الكشف مجاني. تحب أحجز لك؟`;
      return "عندنا تنظيف وحشو وتبييض وزراعة وتقويم. أي خدمة تسأل عنها؟";}
    if(intent==="hours") return `دوامنا ${CLINIC.hours}. تحب أحجز لك موعد؟`;
    if(intent==="location") return `موقعنا في ${CLINIC.address}. تحب أحجز لك موعد؟`;
    if(intent==="cancel"){S.outcome="escalate";S.done=true;return "للإلغاء أو التأجيل بحوّلك لأحد الفريق، بيتواصلون معك.";}
    if(++S.miss>=2){S.outcome="escalate";S.done=true;return "عشان أخدمك أفضل، بسجّل رقمك ويتواصل معك أحد الفريق.";}
    return "عذراً، ما وصلني كلامك زين. تحب تحجز موعد ولا تسأل عن خدمة؟";
  }
  if(S.state==="slot"){
    let c=null;
    if(has("الاول","اول","الاولي")) c=S.offered[0];
    else if(has("الثاني","التاني","الثانيه")) c=S.offered[1]||null;
    else if(has("تمام","زين","مناسب","اوك","نعم","ماشي","طيب")) c=S.offered[0];
    if(!c){
      if(intent==="hours") return `دوامنا ${CLINIC.hours}. نرجع للموعد — الأول ولا الثاني؟`;
      if(intent==="location") return `موقعنا في ${CLINIC.address}. نرجع للموعد — الأول ولا الثاني؟`;
      if(intent==="price"){const [sv,pr]=findService(text); if(sv)S.service=sv;
        return (sv&&pr)?`${sv} بـ ${pr}. نرجع للموعد — الأول ولا الثاني؟`:"الأسعار تختلف حسب الخدمة. نرجع للموعد — الأول ولا الثاني؟";}
      if(intent==="booking"){S.offered=nextSlots(2);
        return `متوفر عندنا ${S.offered.map(fmtSlot).join(" أو ")}. أيهم يناسبك؟`;}
      if(++S.miss>=2){S.outcome="escalate";S.done=true;
        return "خلني أحوّلك لأحد الفريق عشان يخدمك بشكل أفضل. بيتواصلون معك قريب.";}
      return "ما ضبطت. تفضل الموعد الأول ولا الثاني؟";
    }
    S.miss=0; S.slot=c; S.state="name"; return "تمام. الاسم الكريم؟";
  }
  if(S.state==="name"){
    S.name=text.trim().replace(/^(انا|أنا|اسمي|اسمى|الاسم)\s*/,"")||"غير محدد";
    S.state="phone"; return `تشرفنا ${S.name}. ورقم الجوال للتأكيد؟`;
  }
  if(S.state==="phone"){
    const p=extractPhone(text);
    if(!p){ if(++S.miss>=3) S.phone="غير محدد"; else return "ما وصلني الرقم صحيح. ممكن تعيده رقم رقم؟"; }
    else S.phone=p;
    booked.add(S.slot.toISOString().slice(0,16)); S.outcome="confirmed"; S.done=true;
    return `تم الحجز ${S.name} — ${fmtSlot(S.slot)}. بيوصلك تأكيد على الجوال. في أمان الله.`;
  }
  S.done=true; return GOODBYE;
}

/* ══════════════ ٧) ملخص العيادة ══════════════ */
function summary(){
  if(S.outcome==="confirmed"&&S.slot)
    return `🦷 حجز جديد — ${CLINIC.name}\n─────────────\nالاسم: ${S.name||"لم يُذكر"}\nالجوال: ${S.phone||"لم يُذكر"}\nالخدمة: ${S.service||"كشف عام"}\nالموعد: ${fmtSlot(S.slot)}\n─────────────\nعبر الرد الآلي`;
  const o=S.outcome==="escalate"?"يحتاج متابعة ⚠️":"بدون حجز";
  return `📞 مكالمة — ${CLINIC.name}\n─────────────\nالحالة: ${o}\n─────────────\n`+
    S.log.map(([w,m])=>`${w==="bot"?"الوكيل":"المتصل"}: ${m}`).join("\n");
}

/* ══════════════ ٨) الصوت — نطق ══════════════ */
let voices=[], chosenVoice=null, speaking=false;

function loadVoices(){
  voices = speechSynthesis.getVoices();
  const ar = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith("ar"));
  const sel = document.getElementById("voiceSel");
  const note = document.getElementById("voiceNote");
  sel.innerHTML = "";

  if(ar.length){
    ar.forEach((v,i) => { const o=document.createElement("option"); o.value=v.name; o.textContent=`${v.name} (${v.lang})`; sel.appendChild(o); });
    // نفضّل السعودي لو موجود
    const saudi = ar.find(v => v.lang.toLowerCase().includes("sa"));
    chosenVoice = saudi || ar[0];
    sel.value = chosenVoice.name;
    note.innerHTML = `<span class="ok">✓ لقيت ${ar.length} صوت عربي</span>`;
  } else {
    const o=document.createElement("option"); o.textContent="مفيش صوت عربي على الجهاز"; sel.appendChild(o);
    chosenVoice = null;
    note.innerHTML = `⚠️ الجهاز مفيهوش صوت عربي.<br>Windows: Settings ← Time & language ← Language ← Add a language ← العربية (السعودية) ← فعّل Speech.`;
  }
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();
document.getElementById("voiceSel").addEventListener("change", e => {
  chosenVoice = voices.find(v => v.name === e.target.value) || null;
});

function speak(text){
  return new Promise(resolve => {
    if(!("speechSynthesis" in window)){ resolve(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    if(chosenVoice) u.voice = chosenVoice;
    u.lang = chosenVoice ? chosenVoice.lang : "ar-SA";
    u.rate = 1.0; u.pitch = 1.0;
    speaking = true; setMic("speak","🔊 بيتكلم…");
    u.onend = () => { speaking=false; resolve(); };
    u.onerror = () => { speaking=false; resolve(); };
    speechSynthesis.speak(u);
  });
}

/* ══════════════ ٩) الصوت — استماع ══════════════ */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec=null, listening=false;

function initRec(){
  if(!SR) return null;
  const r = new SR();
  r.lang = "ar-SA";
  r.continuous = false;
  r.interimResults = true;
  r.maxAlternatives = 1;

  r.onstart = () => { listening=true; setMic("rec","🔴 بيسمع… اتكلم"); };
  r.onresult = e => {
    let finalT="", interim="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal) finalT+=t; else interim+=t;
    }
    if(interim) setMic("rec","🔴 "+interim);
    if(finalT.trim()){ listening=false; r.stop(); handleVoice(finalT.trim()); }
  };
  r.onerror = e => {
    listening=false; setMic("","دوس الميكروفون وابدأ اتكلم");
    const msgs = {
      "not-allowed":"مرفوض الوصول للميكروفون. اسمح للصفحة تستخدمه.",
      "no-speech":"ما سمعت صوت. جرّب تاني وقرّب من الميك.",
      "audio-capture":"مفيش ميكروفون متوصّل.",
      "network":"مشكلة اتصال — التعرف على الصوت محتاج إنترنت.",
      "service-not-allowed":"المتصفح مانع التعرف على الصوت. جرّب Chrome."
    };
    document.getElementById("err").textContent = "🎤 " + (msgs[e.error] || e.error);
  };
  r.onend = () => { listening=false; if(!speaking) setMic("","دوس الميكروفون وابدأ اتكلم"); };
  return r;
}

function setMic(cls, status){
  const m=document.getElementById("mic");
  m.className = "mic " + cls;
  m.textContent = cls==="rec" ? "⏹" : (cls==="speak" ? "🔊" : "🎤");
  document.getElementById("vstat").textContent = status;
}

function toggleMic(){
  if(!SR){
    document.getElementById("err").textContent="🎤 المتصفح ده مبيدعمش التعرف على الصوت. استخدم Chrome أو Edge.";
    return;
  }
  if(listening){ rec.stop(); listening=false; setMic("","دوس الميكروفون وابدأ اتكلم"); return; }
  if(S.done){ reset(); }
  document.getElementById("err").textContent="";
  rec = rec || initRec();
  try{ rec.start(); }catch(e){ /* لو شغال بالفعل */ }
}

function stopAll(){
  try{ if(rec) rec.stop(); }catch(e){}
  try{ speechSynthesis.cancel(); }catch(e){}
  listening=false; speaking=false;
  setMic("","دوس الميكروفون وابدأ اتكلم");
}

async function handleVoice(text){
  document.getElementById("inp").value = text;
  await send(true);
}

/* ══════════════ ١٠) الواجهة ══════════════ */
function add(cls,text){
  const c=document.getElementById("chat"); const d=document.createElement("div");
  d.className="msg "+cls; d.textContent=text; c.appendChild(d); c.scrollTop=c.scrollHeight; return d;
}
function bot(t){ add("bot",t); S.log.push(["bot",t]); }
function usr(t){ add("user",t); S.log.push(["usr",t]); }

function setMode(){
  const k=document.getElementById("key").value.trim(), has=k.length>10;
  const b=document.getElementById("mode");
  b.className="badge "+(has?"ai":"basic");
  b.textContent = has ? "عقل AI ✨ ("+(keyProvider(k)==="openai"?"OpenAI":"Google")+")" : "وضع بسيط";
  try{ localStorage.setItem("vk",k); }catch(e){}
}

async function send(fromVoice=false){
  const i=document.getElementById("inp"), v=i.value.trim();
  if(!v||S.done){ if(S.done) endHint(); return; }
  usr(v); i.value="";
  const btn=document.getElementById("sendBtn"); btn.disabled=true;
  const key=document.getElementById("key").value.trim();

  let replyText="";
  if(key.length>10){
    const t=add("msg bot typing","…بيفكر");
    try{
      const d=await aiReply(v);
      t.remove(); replyText=d.reply||"…"; bot(replyText); applyAction(d);
    }catch(e){
      t.remove();
      document.getElementById("err").textContent=`⚠️ [${keyProvider(key)==="openai"?"OpenAI":"Google"}] ${e.message}`;
      replyText=basicReply(v); bot(replyText);
    }
  } else {
    await new Promise(r=>setTimeout(r,200));
    replyText=basicReply(v); bot(replyText);
  }

  btn.disabled=false;
  if(S.done){ document.getElementById("wa").textContent=summary(); }

  if(fromVoice){
    await speak(replyText);
    if(S.done){ endHint(); setMic("","انتهت المكالمة — دوس ↺ لواحدة جديدة"); }
    else if(document.getElementById("auto").checked){
      setTimeout(()=>{ if(!S.done && !listening) toggleMic(); }, 300);
    } else setMic("","دوس الميكروفون وابدأ اتكلم");
  } else if(S.done) endHint();

  i.focus();
}
function endHint(){
  const c=document.getElementById("chat");
  if(c.querySelector(".sys")) return;
  const d=document.createElement("div"); d.className="msg sys";
  d.textContent="— انتهت المكالمة — اضغط ↺ لمكالمة جديدة";
  c.appendChild(d); c.scrollTop=c.scrollHeight;
}

document.getElementById("inp").addEventListener("keydown",e=>{ if(e.key==="Enter") send(false); });
document.getElementById("clinicTitle").textContent="📞 "+CLINIC.name;
try{ const k=localStorage.getItem("vk"); if(k) document.getElementById("key").value=k; }catch(e){}
if(!SR) document.getElementById("vstat").textContent="⚠️ استخدم Chrome أو Edge عشان الصوت يشتغل";
setMode();
reset();
</script>
