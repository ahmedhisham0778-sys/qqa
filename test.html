<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تشخيص الصوت</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,Tahoma,sans-serif;background:#0e1420;color:#e8eef5;padding:20px;line-height:1.7}
.w{max-width:820px;margin:0 auto}
h1{font-size:20px;margin-bottom:6px}
.sub{color:#7d8fa3;font-size:13px;margin-bottom:20px}
.card{background:#18222f;border:1px solid #2a3746;border-radius:14px;padding:18px;margin-bottom:16px}
.card h2{font-size:15px;margin-bottom:12px;color:#a8bccf}
.line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #223040;font-size:14px}
.line:last-child{border:0}
.line b{color:#94a3b8;font-weight:500}
.ok{color:#4ade80;font-weight:700}
.bad{color:#f87171;font-weight:700}
.warn{color:#fbbf24;font-weight:700}
button{padding:12px 18px;border:0;border-radius:10px;background:#4f6ef7;color:#fff;
  font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin:5px 5px 5px 0}
button:hover{background:#3f5ce0}
button.g{background:#16a34a}
button.o{background:#334155}
#log{background:#0a0f18;border:1px solid #223040;border-radius:10px;padding:14px;
  font-family:monospace;font-size:12.5px;direction:ltr;text-align:left;max-height:260px;overflow:auto;white-space:pre-wrap}
.vlist{max-height:240px;overflow:auto;margin-top:10px}
.v{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:8px 10px;border-bottom:1px solid #223040;font-size:13px;direction:ltr;text-align:left}
.v.ar{background:rgba(74,222,128,.08)}
.v button{margin:0;padding:6px 13px;font-size:12.5px}
.big{font-size:17px;padding:16px 24px;width:100%;margin:8px 0}
</style>
</head>
<body>
<div class="w">
  <h1>🔍 تشخيص الصوت</h1>
  <div class="sub">الصفحة دي بتفحص كل حاجة تخص النطق وتقولك المشكلة فين</div>

  <div class="card">
    <h2>١. الفحص الأساسي</h2>
    <div id="basic"></div>
  </div>

  <div class="card">
    <h2>٢. اختبار سريع</h2>
    <button class="big g" onclick="testAr()">▶ انطق جملة عربية</button>
    <button class="big" onclick="testEn()">▶ انطق جملة إنجليزية (للمقارنة)</button>
    <button class="o" onclick="reload()">↻ أعد تحميل الأصوات</button>
    <button class="o" onclick="document.getElementById('log').textContent=''">مسح السجل</button>
  </div>

  <div class="card">
    <h2>٣. الأصوات على جهازك (<span id="cnt">0</span>)</h2>
    <div class="sub" style="margin:0">الأخضر = صوت عربي. دوس «نطق» على أي واحد لتجربته.</div>
    <div class="vlist" id="vlist"></div>
  </div>

  <div class="card">
    <h2>٤. السجل — صوّر ده وابعتهولي</h2>
    <div id="log"></div>
  </div>
</div>

<script>
const logEl=document.getElementById("log");
function log(m){
  const t=new Date().toLocaleTimeString('en-GB');
  logEl.textContent+=`[${t}] ${m}\n`;
  logEl.scrollTop=logEl.scrollHeight;
  console.log(m);
}

function row(label,value,cls){
  return `<div class="line"><b>${label}</b><span class="${cls||''}">${value}</span></div>`;
}

let voices=[];

function basicCheck(){
  const has = "speechSynthesis" in window;
  const ua = navigator.userAgent;
  let browser = "غير معروف";
  if(/Edg\//.test(ua)) browser="Edge";
  else if(/Chrome\//.test(ua)) browser="Chrome";
  else if(/Firefox\//.test(ua)) browser="Firefox";
  else if(/Safari\//.test(ua)) browser="Safari";

  const ar = voices.filter(v=>v.lang&&v.lang.toLowerCase().startsWith("ar"));

  document.getElementById("basic").innerHTML =
    row("المتصفح", browser, browser==="Chrome"||browser==="Edge"?"ok":"warn") +
    row("البروتوكول", location.protocol, location.protocol==="https:"?"ok":"bad") +
    row("دعم النطق (speechSynthesis)", has?"موجود ✓":"غير موجود ✗", has?"ok":"bad") +
    row("عدد الأصوات الكلي", voices.length, voices.length?"ok":"bad") +
    row("أصوات عربية", ar.length, ar.length?"ok":"bad") +
    row("نظام التشغيل", navigator.platform, "");
}

function renderVoices(){
  document.getElementById("cnt").textContent = voices.length;
  const box=document.getElementById("vlist");
  if(!voices.length){ box.innerHTML='<div class="v"><span class="bad">لا توجد أصوات — اضغط «أعد تحميل الأصوات»</span></div>'; return; }
  box.innerHTML = voices.map((v,i)=>{
    const isAr = v.lang && v.lang.toLowerCase().startsWith("ar");
    return `<div class="v ${isAr?'ar':''}">
      <span>${isAr?'🟢':'⚪'} ${v.name} <b style="color:#64748b">· ${v.lang}</b></span>
      <button onclick="sayWith(${i})">نطق</button></div>`;
  }).join("");
}

function loadVoices(){
  voices = speechSynthesis.getVoices();
  log(`getVoices() رجّع ${voices.length} صوت`);
  basicCheck(); renderVoices();
}
speechSynthesis.onvoiceschanged=()=>{ log("حدث voiceschanged"); loadVoices(); };

function reload(){ log("— إعادة تحميل يدوية —"); loadVoices(); }

function say(text, voice){
  if(!("speechSynthesis" in window)){ log("✗ المتصفح لا يدعم النطق"); return; }
  speechSynthesis.cancel();
  setTimeout(()=>{
    const u=new SpeechSynthesisUtterance(text);
    if(voice){ u.voice=voice; u.lang=voice.lang; }
    u.volume=1; u.rate=1; u.pitch=1;
    u.onstart=()=>log(`▶ بدأ النطق — الصوت: ${voice?voice.name:"الافتراضي"}`);
    u.onend  =()=>log("✓ انتهى النطق بنجاح");
    u.onerror=e=>log(`✗ خطأ في النطق: ${e.error}`);
    log(`إرسال للنطق: "${text.slice(0,40)}"`);
    speechSynthesis.speak(u);
    setTimeout(()=>{
      log(`بعد ثانية → speaking=${speechSynthesis.speaking} pending=${speechSynthesis.pending} paused=${speechSynthesis.paused}`);
      if(!speechSynthesis.speaking && !speechSynthesis.pending)
        log("⚠️ لم يبدأ النطق إطلاقاً — تحقق من صوت الجهاز أو كتم التاب");
    },1000);
  },80);
}

function testAr(){
  const ar = voices.filter(v=>v.lang&&v.lang.toLowerCase().startsWith("ar"));
  if(!ar.length){
    log("⚠️ لا يوجد صوت عربي — سأجرب بالصوت الافتراضي");
    say("أهلاً وسهلاً، عيادة الابتسامة", null);
    return;
  }
  const pick = ar.find(v=>v.lang.toLowerCase().includes("sa")) || ar[0];
  say("أهلاً وسهلاً، عيادة الابتسامة. كيف أقدر أساعدك؟", pick);
}
function testEn(){
  const en = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith("en"));
  say("Hello, this is a test of the speech system.", en||null);
}
function sayWith(i){ say("أهلاً وسهلاً، كيف أقدر أساعدك؟", voices[i]); }

log("بدأ التشخيص");
log("العنوان: "+location.href);
loadVoices();
setTimeout(loadVoices,400);
setTimeout(loadVoices,1500);
</script>
</body>
</html>
